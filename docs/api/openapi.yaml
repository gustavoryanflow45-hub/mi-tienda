    CategoryRef:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    ProductVariants:
      type: object
      required: [size_label, sizes, colors, combinations]
      properties:
        size_label: { type: string }
        sizes: { type: array, items: { type: string } }
