openapi: 3.1.0
info:
  title: Mi Tienda — API móvil v1
  version: 1.0.0
  summary: API para las apps de compradores y vendedores (Flutter).
  description: |
    Contrato de `/api/v1`. La guía en prosa (flujos, decisiones, notas para
    Flutter) es `docs/api/v1.md`; este archivo es la referencia de máquina:
    de él se genera el cliente Dart de `clients/dart/mi_tienda_api`
    (`swagger_parser`; ver "Cliente Dart" en `v1.md`), y se puede abrir en
    Swagger UI / Redoc.

    `tests/Feature/Api/V1/OpenApiSpecTest.php` falla si una ruta de la API
    falta aquí (o sobra), si la seguridad o las habilidades no coinciden con
    las de la ruta, o si una respuesta real deja de cumplir su esquema.

    **Errores**: siempre `{ message, code }` (+ `errors` en
    `validation_failed`). La app decide por `code`; `message` va traducido
    según `Accept-Language` (`es` por defecto, `en`).

    **Habilidades**: cada operación con token lista en `x-abilities` las que
    exige el token (ver `/auth/login`). Las de vendedor además exigen la
    tienda aprobada en cada petición (`403 shop_not_approved`).
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local (php artisan serve)
  - url: https://{host}/api/v1
    description: Producción
    variables:
      host:
        default: example.com
tags:
  - name: Auth
    description: 'Alta, login por dispositivo, rotación de token, sesiones y token push.'
  - name: Catalogo
    x-displayName: Catálogo
    description: 'Portada, categorías, marcas y productos a la venta (público, sin token).'
  - name: Carrito
    description: 'El carrito del usuario: el mismo de la web, con las mismas reglas.'
  - name: Checkout
    description: 'Resumen y pedido pendiente antes de pagar.'
  - name: Pagos
    description: 'Cobro de un pedido con Stripe (PaymentSheet) o PayPhone (navegador in-app).'
  - name: Perfil
    description: 'Datos, foto y contraseña del usuario.'
  - name: Pedidos
    description: 'Pedidos del comprador y su seguimiento.'
  - name: Vendedor
    description: 'Panel del vendedor con la tienda aprobada: resumen, productos y ventas.'
  - name: Billetera
    description: 'Saldo, recargas, retiros y liquidaciones; todo lo aprueba el panel.'
  - name: Notificaciones
    description: 'Avisos del usuario (los mismos que llegan por push).'

security:
  - bearer: []

paths:
  # ── Auth ──────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Alta de comprador (sin token; hay que verificar el correo)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: 'Letras y números.' }
                password_confirmation: { type: string }
                phone: { type: [string, 'null'], maxLength: 20 }
      responses:
        '201':
          description: Cuenta creada. Sin token.
          content:
            application/json:
              schema:
                type: object
                required: [data, message]
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  message: { type: string }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login; un token por dispositivo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_id, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_id:
                  type: string
                  maxLength: 100
                  pattern: '^[A-Za-z0-9._:-]+$'
                  description: UUID estable generado por la app al instalarse.
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Token' }
        '401':
          description: '`invalid_credentials` (igual exista o no el correo).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`email_not_verified` o `account_disabled`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Reenvía el correo de verificación (misma respuesta exista o no)
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Email'
      responses:
        '202': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Envía el enlace para elegir contraseña nueva (abre la web)
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Email'
      responses:
        '202': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Usuario del token y habilidades del token actual
      x-abilities: ['profile:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/TokenAbilities' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/token/rotate:
    post:
      tags: [Auth]
      operationId: rotateToken
      summary: Token nuevo para este dispositivo; el anterior muere en el acto
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoca el token de este dispositivo
      responses:
        '204': { description: 'Sin contenido.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/devices:
    get:
      tags: [Auth]
      operationId: listDevices
      summary: Sesiones abiertas de la cuenta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [Auth]
      operationId: revokeOtherDevices
      summary: Cierra todas las demás sesiones (con include_current=1, también esta)
      parameters:
        - name: include_current
          in: query
          schema: { type: boolean }
      responses:
        '204': { description: 'Sin contenido.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/devices/{id}:
    delete:
      tags: [Auth]
      operationId: revokeDevice
      summary: Cierra la sesión de un dispositivo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 'Sin contenido.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/push-token:
    put:
      tags: [Auth]
      operationId: registerPushToken
      summary: Registra el token FCM de este dispositivo (el envío aún no existe)
      description: |
        Llamar tras el login y cada vez que FCM rote el token. Vive en la
        sesión del dispositivo: cerrar sesión o revocarlo lo borra, y rotar el
        token de acceso lo conserva. Un mismo token FCM se quita de cualquier
        otra sesión (otra cuenta abierta antes en ese móvil).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, minLength: 20, maxLength: 255 }
                platform: { type: string, enum: [android, ios] }
      responses:
        '200':
          description: La sesión de este dispositivo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Auth]
      operationId: unregisterPushToken
      summary: Quita el token FCM de este dispositivo (la sesión sigue abierta)
      responses:
        '204': { description: 'Sin contenido.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ── Catálogo ──────────────────────────────────────────────────────
  /home:
    get:
      tags: [Catalogo]
      operationId: home
      summary: Portada (banners y tres secciones de hasta 12 productos)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HomeFeed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /brands:
    get:
      tags: [Catalogo]
      operationId: listBrands
      summary: 'Marcas activas'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Brand' } }

        '429': { $ref: '#/components/responses/TooManyRequests' }
  /categories:
    get:
      tags: [Catalogo]
      operationId: listCategories
      summary: Árbol de categorías activas (raíces con sus children)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }

        '429': { $ref: '#/components/responses/TooManyRequests' }
  /categories/{slug}:
    get:
      tags: [Catalogo]
      operationId: showCategory
      summary: 'Una categoría con sus subcategorías y su padre'
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      tags: [Catalogo]
      operationId: listProducts
      summary: Productos a la venta, paginados
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, description: 'Slug; incluye subcategorías.', schema: { type: string } }
        - { name: brand, in: query, schema: { type: integer } }
        - { name: min_price, in: query, schema: { type: number, minimum: 0 } }
        - { name: max_price, in: query, schema: { type: number, minimum: 0 } }
        - { name: featured, in: query, schema: { type: boolean } }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc, popular, rating], default: newest }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /products/{product}:
    get:
      tags: [Catalogo]
      operationId: showProduct
      summary: Ficha (por slug o por id)
      security: []
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Carrito ───────────────────────────────────────────────────────
  /cart:
    get:
      tags: [Carrito]
      operationId: showCart
      summary: 'Carrito del usuario'
      x-abilities: ['cart:write']
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Carrito]
      operationId: clearCart
      summary: 'Vacía el carrito'
      x-abilities: ['cart:write']
      responses:
        '204': { description: 'Carrito vacío.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cart/items:
    post:
      tags: [Carrito]
      operationId: addCartItem
      summary: Añade una combinación (suma si la línea ya existe, con tope en el stock)
      x-abilities: ['cart:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: integer }
                variation:
                  type: [string, 'null']
                  description: '`variants.combinations[].variation` de la ficha; "" sin variantes.'
                quantity: { type: integer, minimum: 1, maximum: 999, default: 1 }
      responses:
        '201': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /cart/items/{item}:
    patch:
      tags: [Carrito]
      operationId: updateCartItem
      summary: Cambia la cantidad (limitada al stock)
      x-abilities: ['cart:write']
      parameters:
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Carrito]
      operationId: removeCartItem
      summary: 'Quita una línea del carrito'
      x-abilities: ['cart:write']
      parameters:
        - { name: item, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Checkout ──────────────────────────────────────────────────────
  /checkout:
    get:
      tags: [Checkout]
      operationId: checkoutSummary
      summary: Resumen, envío del perfil y pasarela sugerida (no crea nada)
      x-abilities: ['checkout:write']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CheckoutSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /checkout/orders:
    post:
      tags: [Checkout]
      operationId: createOrder
      summary: Crea (o pone al día, con order_id) el pedido pendiente
      x-abilities: ['checkout:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ShippingInput'
                - type: object
                  properties:
                    order_id: { type: [integer, 'null'], description: 'Pedido propio sin pagar a reutilizar.' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '201': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /checkout/orders/{order}:
    get:
      tags: [Checkout]
      operationId: checkoutOrder
      summary: Estado del pedido tras pagar
      x-abilities: ['checkout:write']
      parameters:
        - $ref: '#/components/parameters/Order'
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checkout/orders/{order}/stripe:
    post:
      tags: [Pagos]
      operationId: stripeIntent
      summary: PaymentIntent para la PaymentSheet de flutter_stripe
      description: Antes vuelve a sincronizar el pedido con el carrito.
      x-abilities: ['checkout:write']
      parameters:
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StripePaymentIntent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`payment_in_progress`: ya hay un cobro en curso o hecho.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /checkout/orders/{order}/stripe/confirm:
    post:
      tags: [Pagos]
      operationId: stripeConfirm
      summary: Verifica el pago en Stripe (sin esperar al webhook)
      x-abilities: ['checkout:write']
      parameters:
        - $ref: '#/components/parameters/Order'
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /checkout/orders/{order}/payphone:
    post:
      tags: [Pagos]
      operationId: payphoneStart
      summary: URL de pago de PayPhone para un navegador in-app
      description: Antes vuelve a sincronizar el pedido con el carrito.
      x-abilities: ['checkout:write']
      parameters:
        - $ref: '#/components/parameters/Order'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [card, app], default: card }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PayphonePayment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: '`http_error`: PayPhone sin configurar en el servidor.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /checkout/orders/{order}/payphone/confirm:
    post:
      tags: [Pagos]
      operationId: payphoneConfirm
      summary: Confirma una transacción de PayPhone de este pedido
      x-abilities: ['checkout:write']
      parameters:
        - $ref: '#/components/parameters/Order'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, client_transaction_id]
              properties:
                id: { type: integer, description: '`id` de la URL de vuelta de PayPhone.' }
                client_transaction_id: { type: string, maxLength: 50 }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ── Perfil ────────────────────────────────────────────────────────
  /profile:
    get:
      tags: [Perfil]
      operationId: showProfile
      summary: 'Perfil del usuario del token'
      x-abilities: ['profile:read']
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Perfil]
      operationId: updateProfile
      summary: Nombre y teléfono (el correo no se cambia desde la app)
      x-abilities: ['profile:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                phone: { type: [string, 'null'], maxLength: 20 }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /profile/avatar:
    post:
      tags: [Perfil]
      operationId: uploadAvatar
      summary: 'Sube la foto de perfil'
      x-abilities: ['profile:write']
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary, description: 'jpg, png o webp.' }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /profile/password:
    put:
      tags: [Perfil]
      operationId: changePassword
      summary: Cambia la contraseña y cierra los demás dispositivos
      x-abilities: ['profile:write']
      requestBody:
        required: true
        content:
