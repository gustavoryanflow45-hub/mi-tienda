      required: [total_sales, commission_rate, commission, net_amount, lines]
      properties:
        total_sales: { type: number }
        commission_rate: { type: number }
        commission: { type: number }
        net_amount: { type: number }
        lines: { type: integer }
    LastSettlement:
      type: object
      required: [net_amount, settled_at]
      properties:
        net_amount: { type: number }
        settled_at: { $ref: '#/components/schemas/NullableDateTime' }
    OptionCategory:
      type: object
      required: [id, name, parent_id, variant_type]
      properties:
        id: { type: integer }
        name: { type: string }
