        thumbnail_url: { type: string }
        on_sale: { type: boolean, description: 'false = despublicado o vetado tras añadirlo.' }
    CartData:
      type: object
      required: [items, count, totals, currency]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        count: { type: integer }
        totals: { $ref: '#/components/schemas/Totals' }
        currency: { type: string, const: USD }
    SettlementCycle:
      type: object
