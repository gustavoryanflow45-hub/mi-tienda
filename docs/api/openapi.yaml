        color: { type: [string, 'null'] }
        price: { type: number }
        qty: { type: integer }
        sku: { type: [string, 'null'] }
    StockInput:
      type: object
      required: [price, qty]
      properties:
        size: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
