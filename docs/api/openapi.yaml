components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Token de Sanctum de `/auth/login` (`Authorization: Bearer 12|…`).'

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID que la app genera por cada envío del formulario y repite al
        reintentar. Misma clave y mismo cuerpo → se devuelve la respuesta del
        primer envío (cabecera `Idempotent-Replayed: true`) sin crear otra
        solicitud; misma clave con otro cuerpo → `422 idempotency_key_reused`.
        Vale 24 h; un error no se guarda (se puede reintentar con la misma).
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
    Order: { name: order, in: path, required: true, schema: { type: integer } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
    DeliveryStatus:
      name: delivery_status
      in: query
      schema: { $ref: '#/components/schemas/DeliveryStatus' }

  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }

  responses:
    Message:
      description: Acción sin recurso.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    Unauthenticated:
      description: '`unauthenticated`: sin token, revocado o caducado.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`forbidden` (falta la habilidad) o `account_disabled`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SellerForbidden:
      description: '`forbidden`, `account_disabled` o `shop_not_approved`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`not_found` (inexistente o ajeno).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: '`validation_failed` (con `errors`), `business_rule` o `idempotency_key_reused`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    IdempotencyKeyRequired:
      description: '`idempotency_key_required`: falta la cabecera Idempotency-Key o no es válida.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RequestInProgress:
      description: '`request_in_progress`: otra petición con la misma Idempotency-Key se está procesando.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: '`too_many_requests`; esperar `Retry-After` segundos.'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    User:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/User' }
    Cart:
      description: El carrito completo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CartEnvelope' }
    Order:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Order' }
    SellerProduct:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/SellerProduct' }
    SellerOrder:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/SellerOrder' }

  schemas:
    # ── Comunes ──
    Error:
      type: object
      required: [message, code]
      properties:
        message: { type: string, description: 'Traducido; para mostrar.' }
        code:
          type: string
          enum:
            - unauthenticated
            - invalid_credentials
            - email_not_verified
            - account_disabled
            - forbidden
            - shop_not_approved
            - not_found
            - method_not_allowed
            - payment_in_progress
            - idempotency_key_required
            - idempotency_key_reused
            - request_in_progress
            - validation_failed
            - business_rule
            - too_many_requests
            - http_error
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties: { type: array, items: { type: string } }
    Paginated:
      type: object
      required: [data, links, meta]
      properties:
        data: { type: array }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    NullableDateTime: { type: [string, 'null'], format: date-time }
    Gateway: { type: string, enum: [stripe, payphone] }
    DeliveryStatus: { type: string, enum: [pending, confirmed, warehouse, on_the_way, delivered] }

    # ── Cuenta ──
    User:
      type: object
      required: [id, name, email, phone, avatar_url, type, email_verified, balance, shop, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
        type: { type: string, enum: [customer, seller] }
        email_verified: { type: boolean }
        balance: { type: number }
        shop:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/UserShop'
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
    Token:
      type: object
      required: [token, token_type, expires_at, abilities, device, user]
      properties:
        token: { type: string, description: 'Guardar en almacenamiento seguro.' }
        token_type: { type: string, const: Bearer }
        expires_at: { $ref: '#/components/schemas/NullableDateTime' }
        abilities: { type: array, items: { type: string } }
        device: { $ref: '#/components/schemas/TokenDevice' }
        user: { $ref: '#/components/schemas/User' }
    Device:
      type: object
      required: [id, device_id, device_name, abilities, current, last_used_at, created_at, expires_at, push_enabled, push_platform]
      properties:
        id: { type: integer }
        device_id: { type: [string, 'null'] }
        device_name: { type: string }
        abilities: { type: array, items: { type: string } }
        current: { type: boolean }
        last_used_at: { $ref: '#/components/schemas/NullableDateTime' }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
        expires_at: { $ref: '#/components/schemas/NullableDateTime' }
        push_enabled: { type: boolean, description: 'Hay un token FCM registrado (nunca se devuelve).' }
        push_platform: { type: [string, 'null'], enum: [android, ios, null] }

    # ── Catálogo ──
    Banner:
      type: object
      required: [id, title, image_url, link]
      properties:
        id: { type: integer }
        title: { type: [string, 'null'] }
        image_url: { type: string }
        link: { type: [string, 'null'] }
    Brand:
      type: object
      required: [id, name, slug, logo_url]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: [string, 'null'] }
        logo_url: { type: [string, 'null'] }
    Category:
      type: object
      required: [id, name, slug, parent_id, icon_url, banner_url]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        parent_id: { type: [integer, 'null'] }
        icon_url: { type: [string, 'null'] }
        banner_url: { type: [string, 'null'] }
        children:
          type: array
          description: Subcategorías activas (en el árbol y en `/categories/{slug}`).
          items: { $ref: '#/components/schemas/Category' }
        parent:
          description: Solo en `/categories/{slug}`; null en una raíz.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Category'
    Discount:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [percent, amount] }
        value: { type: number }
    ProductCard:
      type: object
      required: [id, slug, name, thumbnail_url, price, original_price, discount, unit, rating, in_stock, has_variants, category, brand]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        thumbnail_url: { type: string }
        price: { type: number, description: 'Lo que se cobra (con descuento).' }
        original_price: { type: number }
        discount:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Discount'
        unit: { type: [string, 'null'] }
        rating: { type: number }
        in_stock: { type: boolean }
        has_variants: { type: boolean, description: 'Hay que elegir combinación antes de añadir.' }
        category:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CategoryRef'
        brand:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NamedRef'
    Color:
      type: object
      required: [key, label, hex]
      properties:
        key: { type: string }
        label: { type: string }
        hex: { type: [string, 'null'] }
    Combination:
      type: object
      required: [variation, size, color, price, original_price, qty, available]
      properties:
        variation: { type: string, description: 'Clave para `POST /cart/items`; "" sin variantes.' }
        size: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        price: { type: number }
        original_price: { type: number }
        qty: { type: integer }
        available: { type: boolean }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [photos, short_description, description, min_qty, shipping_cost, shop, variants]
          properties:
            photos: { type: array, items: { type: string } }
            short_description: { type: [string, 'null'] }
            description: { type: [string, 'null'], description: 'Texto plano.' }
            min_qty: { type: integer }
            shipping_cost: { type: number }
            shop:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/NamedRef'
            variants: { $ref: '#/components/schemas/ProductVariants' }
            related: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }

    # ── Carrito y pedidos ──
    VariantInfo:
      type: object
      required: [text, size, size_label, color, color_label, color_hex]
      properties:
        text: { type: string, description: 'Para mostrar: "Talla US 9 · Negro".' }
        size: { type: [string, 'null'] }
        size_label: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        color_label: { type: [string, 'null'] }
        color_hex: { type: [string, 'null'] }
    Totals:
      type: object
      required: [subtotal, shipping, tax, grand_total]
      properties:
        subtotal: { type: number }
        shipping: { type: number }
        tax: { type: number }
        grand_total: { type: number }
    CartItem:
      type: object
      required: [id, product, variation, variant, price, quantity, line_total, shipping_cost, available_qty]
      properties:
        id: { type: integer }
        product:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CartProduct'
        variation: { type: string }
        variant:
          description: 'Talla y color legibles; null sin variación.'
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/VariantInfo'
        price: { type: number, description: 'Unitario fijado al añadir.' }
        quantity: { type: integer }
        line_total: { type: number }
        shipping_cost: { type: number }
        available_qty: { type: integer }
    CartEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CartData' }
        message: { type: string }
    ShippingInput:
      type: object
      required: [full_name, phone, email, address, city]
      properties:
        full_name: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email, maxLength: 255 }
        address: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 100 }
        state: { type: [string, 'null'], maxLength: 100 }
        country: { type: [string, 'null'], maxLength: 100 }
        postal_code: { type: [string, 'null'], maxLength: 20 }
    ShippingAddress:
      type: object
      description: Snapshot de envío; los campos que falten pueden no venir o venir en null.
      properties:
        full_name: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        postal_code: { type: [string, 'null'] }
    OrderItem:
      type: object
      required: [id, product_id, name, thumbnail_url, variation, variant, price, quantity, line_total, shipping_cost]
      properties:
        id: { type: integer }
        product_id: { type: [integer, 'null'] }
        name: { type: string }
        thumbnail_url: { type: string }
        variation: { type: string }
        variant:
          description: 'Talla y color legibles; null sin variación.'
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/VariantInfo'
        price: { type: number }
        quantity: { type: integer }
        line_total: { type: number }
        shipping_cost: { type: number }
    Tracking:
      type: object
      required: [confirmed_at, warehouse_at, dispatched_at, delivered_at]
      properties:
        confirmed_at: { $ref: '#/components/schemas/NullableDateTime' }
        warehouse_at: { $ref: '#/components/schemas/NullableDateTime' }
        dispatched_at: { $ref: '#/components/schemas/NullableDateTime' }
        delivered_at: { $ref: '#/components/schemas/NullableDateTime' }
    Order:
      type: object
      required: [id, code, payment_status, payment_status_label, payment_gateway, delivery_status, delivery_status_label, currency, totals, shipping_address, items, tracking, created_at, paid_at]
      properties:
        id: { type: integer }
        code: { type: string }
        payment_status: { type: string, enum: [paid, unpaid, partial] }
        payment_status_label: { type: string }
        payment_gateway: { type: [string, 'null'], enum: [stripe, payphone, kushki, null] }
        delivery_status: { $ref: '#/components/schemas/DeliveryStatus' }
        delivery_status_label: { type: string }
        currency: { type: string, const: USD }
        totals: { $ref: '#/components/schemas/Totals' }
        shipping_address: { $ref: '#/components/schemas/ShippingAddress' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        tracking: { $ref: '#/components/schemas/Tracking' }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
        paid_at: { $ref: '#/components/schemas/NullableDateTime' }

    # ── Vendedor ──
    SellerDashboard:
      type: object
      required: [shop, currency, products, pending_orders, delivered_orders, current_cycle, last_settlement, balance]
      properties:
        shop: { $ref: '#/components/schemas/NamedRef' }
        currency: { type: string, const: USD }
        products: { type: integer }
        pending_orders: { type: integer, description: 'Pagados y sin confirmar.' }
        delivered_orders: { type: integer }
        current_cycle: { $ref: '#/components/schemas/SettlementCycle' }
        last_settlement:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LastSettlement'
        balance: { type: number }
    SellerProductOptions:
      type: object
      required: [categories, brands, variant_types, colors, max_upload_kb, max_photos]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/OptionCategory' }
        brands:
          type: array
          items: { $ref: '#/components/schemas/NamedRef' }
        variant_types:
          type: array
          items: { $ref: '#/components/schemas/VariantType' }
        colors: { type: array, items: { $ref: '#/components/schemas/Color' } }
        max_upload_kb: { type: integer }
        max_photos: { type: integer }
    SellerProduct:
      type: object
      required: [id, slug, name, category, brand_id, unit_price, purchase_price, discount, discount_type, final_price, unit, variant_type, size_label, short_description, description, min_qty, low_stock_qty, shipping_cost, published, approved, on_sale, thumbnail_url, photos, stocks, total_qty, created_at]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        category:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NamedRef'
        brand_id: { type: [integer, 'null'] }
        unit_price: { type: number }
        purchase_price: { type: [number, 'null'] }
        discount: { type: number }
        discount_type: { type: string, enum: [percent, amount] }
        final_price: { type: number }
        unit: { type: [string, 'null'] }
        variant_type: { type: [string, 'null'], description: 'null = el de la categoría.' }
        size_label: { type: [string, 'null'] }
        short_description: { type: [string, 'null'] }
        description: { type: [string, 'null'], description: 'HTML del vendedor.' }
        min_qty: { type: integer }
        low_stock_qty: { type: integer }
        shipping_cost: { type: number }
        published: { type: boolean, description: 'Decisión del vendedor.' }
        approved: { type: boolean, description: 'false = desactivado por moderación.' }
        on_sale: { type: boolean }
        thumbnail_url: { type: string }
        photos: { type: array, items: { type: string } }
        stocks:
          type: array
          items: { $ref: '#/components/schemas/SellerStock' }
        total_qty: { type: integer }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
    SellerProductInput:
      type: object
      description: Campos del formulario web; cualquier otro (added_by, approved…) se ignora.
      properties:
        name: { type: string, maxLength: 255 }
        category_id: { type: integer }
        brand_id: { type: [integer, 'null'] }
        unit_price: { type: number, minimum: 0 }
        purchase_price: { type: [number, 'null'], minimum: 0 }
        discount: { type: number, minimum: 0 }
        discount_type: { type: string, enum: [percent, amount] }
        unit: { type: string, maxLength: 50 }
        variant_type: { type: [string, 'null'], description: 'Clave de `variant_types`.' }
        short_description: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        min_qty: { type: integer, minimum: 1 }
        low_stock_qty: { type: integer, minimum: 0 }
        shipping_cost: { type: number, minimum: 0 }
        published: { type: boolean }
        featured: { type: boolean }
        todays_deal: { type: boolean }
        stocks:
          type: array
          minItems: 1
          description: Una fila por combinación talla × color (en multipart, `stocks[0][size]`…).
          items: { $ref: '#/components/schemas/StockInput' }
    SellerOrder:
      type: object
      required: [id, code, payment_status, payment_status_label, delivery_status, delivery_status_label, actions, currency, seller_total, items, buyer, shipping_address, tracking, created_at, paid_at]
      properties:
        id: { type: integer }
        code: { type: string }
        payment_status: { type: string, enum: [paid] }
        payment_status_label: { type: string }
        delivery_status: { $ref: '#/components/schemas/DeliveryStatus' }
        delivery_status_label: { type: string }
        actions: { $ref: '#/components/schemas/SellerOrderActions' }
        currency: { type: string, const: USD }
        seller_total: { type: number, description: 'Solo las líneas de este vendedor.' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        buyer: { $ref: '#/components/schemas/Buyer' }
        shipping_address: { $ref: '#/components/schemas/ShippingAddress' }
        tracking: { $ref: '#/components/schemas/Tracking' }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
        paid_at: { $ref: '#/components/schemas/NullableDateTime' }

    # ── Billetera y notificaciones ──
    WalletSummary:
      type: object
      required: [balance, currency, network_fee, pending_recharges, pending_withdrawals, min_withdrawal, recharge_networks, max_upload_kb]
      properties:
        balance: { type: number }
        currency: { type: string, const: USD }
        network_fee: { type: number, description: 'Comisión de red de cada recarga y retiro de la app.' }
        pending_recharges: { type: integer }
        pending_withdrawals: { type: integer }
        min_withdrawal: { type: number }
        recharge_networks: { type: array, items: { type: string } }
        max_upload_kb: { type: integer }
    WalletStatus: { type: string, enum: [pending, approved, rejected] }
    WalletRecharge:
      type: object
      required: [id, amount, fee, net_amount, network, transaction_id, has_proof, status, created_at]
      properties:
        id: { type: integer }
        amount: { type: number, description: 'Lo transferido por el usuario.' }
        fee: { type: number, description: 'Comisión de red (0 si se pidió en la web).' }
        net_amount: { type: number, description: 'Lo que se acredita al aprobarse: amount − fee.' }
        network: { type: [string, 'null'] }
        transaction_id: { type: [string, 'null'] }
        has_proof: { type: boolean }
        status: { $ref: '#/components/schemas/WalletStatus' }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
    WalletWithdrawal:
      type: object
      required: [id, amount, fee, net_amount, full_name, bank_name, account_last4, status, from_settlement, created_at]
      properties:
        id: { type: integer }
        amount: { type: number, description: 'Lo descontado del saldo.' }
        fee: { type: number, description: 'Comisión de red (0 si se pidió en la web).' }
        net_amount: { type: number, description: 'Lo que el admin transfiere al aprobarlo: amount − fee.' }
        full_name: { type: string }
        bank_name: { type: string }
        account_last4: { type: string, description: 'La cuenta nunca se devuelve entera.' }
        status: { $ref: '#/components/schemas/WalletStatus' }
        from_settlement: { type: boolean, description: 'true = lo cubren ventas ya liquidadas (dato para el admin; igual espera su aprobación).' }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
    WalletMovement:
      type: object
      required: [type, id, amount, status, occurred_at]
      properties:
        type: { type: string, enum: [recharge, withdrawal, settlement] }
        id: { type: integer, description: 'Id en su tipo: lleva a /wallet/recharges/{id} o /wallet/withdrawals/{id}.' }
        amount: { type: number, description: 'Con signo: + suma al saldo, − resta. En una recarga, ya sin la comisión.' }
        status: { $ref: '#/components/schemas/WalletStatus' }
        occurred_at: { $ref: '#/components/schemas/NullableDateTime' }
    Settlement:
      type: object
      required: [id, total_sales, commission_rate, commission, net_amount, lines, settled_at]
      properties:
        id: { type: integer }
        total_sales: { type: number }
        commission_rate: { type: number }
        commission: { type: number }
        net_amount: { type: number, description: 'Acreditado al saldo.' }
        lines: { type: integer }
        settled_at: { $ref: '#/components/schemas/NullableDateTime' }
    Notification:
      type: object
      required: [id, type, message, payload, read, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [order_status_updated, seller_new_order, seller_settled, shop_status_updated, other]
          description: |
            order_status_updated → payload.order_id, order_code, status;
            seller_new_order → payload.order_id, order_code, total;
            seller_settled → payload.settlement_id, total_sales, commission, net_amount;
            shop_status_updated → payload.shop_id, shop_name, status, approved.
        message: { type: [string, 'null'], description: 'Texto guardado al crearse, en el idioma por defecto de la tienda.' }
        payload: { type: object, description: 'Ids y datos para navegar; según `type`.' }
        read: { type: boolean }
        read_at: { $ref: '#/components/schemas/NullableDateTime' }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }

    # ── Objetos con nombre (antes en línea) ──
    TokenAbilities:
      type: object
      required: [abilities]
      properties:
        abilities: { type: array, items: { type: string } }
    HomeFeed:
      type: object
      required: [banners, featured, new, best_selling]
      properties:
        banners: { type: array, items: { $ref: '#/components/schemas/Banner' } }
        featured: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
        new: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
        best_selling: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
    CheckoutSummary:
      type: object
      required: [items, totals, currency, shipping, payment]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        totals: { $ref: '#/components/schemas/Totals' }
        currency: { type: string, const: USD }
        shipping: { $ref: '#/components/schemas/ShippingAddress' }
        payment: { $ref: '#/components/schemas/CheckoutPayment' }
    StripePaymentIntent:
      type: object
      required: [client_secret, payment_intent_id, publishable_key, amount, currency, order]
      properties:
        client_secret: { type: string }
        payment_intent_id: { type: string }
        publishable_key: { type: [string, 'null'] }
        amount: { type: integer, description: 'En centavos.' }
        currency: { type: string, const: usd }
